services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      JENA_URL: http://jena:3030/ds
    depends_on:
      - jena

  jena:
    image: secoresearch/fuseki:5.6.0
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      FUSEKI_DATASET_1: ds
    volumes:
      - jena-data:/fuseki

volumes:
  jena-data: